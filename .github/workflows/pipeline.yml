name: GitSphere pipeline

on:
  schedule:
    # Hourly; the API budget resets hourly. Minute 13 avoids the top-of-hour rush.
    # If no scheduled runs appear in the Actions tab, disable and re-enable
    # this workflow there (or edit this file) so GitHub re-registers the cron.
    - cron: '13 * * * *'
  workflow_dispatch:
    inputs:
      max_requests:
        description: 'Maximum GraphQL requests for this run'
        required: false
        default: '900'

permissions:
  contents: write

concurrency:
  # One data writer per branch across all data workflows (shared with
  # sync-geography). Runs queue instead of cancelling each other, so a
  # checkpoint is never lost mid-write.
  group: gitsphere-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate
        run: npm run check

      - name: Discover, refresh and publish
        id: pipeline
        # Own timeout so a hang still leaves time to commit checkpoints.
        timeout-minutes: 47
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITSPHERE_MAX_REQUESTS: ${{ inputs.max_requests || '900' }}
          GITSPHERE_RUNTIME_MINUTES: '42'
        run: npm run pipeline

      - name: Secret guard
        id: secrets
        # Runs even if the pipeline failed, so its checkpoints can be kept.
        if: always() && steps.pipeline.outcome != 'skipped'
        run: node scripts/scan-secrets.js data state rankings README.md

      - name: Commit progress
        # Checkpoints are written atomically and in order (registry before
        # scan state), so they are safe to keep after a failed or timed-out
        # pipeline step. Never commits if the secret guard did not pass.
        if: always() && steps.secrets.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state data rankings README.md
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -q -m "data: GitSphere pipeline run"
          for attempt in 1 2 3; do
            # Never overwrite newer data: rebase onto the latest branch tip and
            # stop on any conflict instead of forcing.
            if git pull --rebase --quiet origin "${GITHUB_REF_NAME}"; then
              if git push --quiet origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            else
              git rebase --abort || true
              echo "::error::Rebase conflict with newer commits; refusing to overwrite them."
              exit 1
            fi
            sleep $((attempt * 10))
          done
          echo "::error::Push failed after retries."
          exit 1

      - name: Fail on stalled run or unhealthy scans
        # Committed first so checkpoints are kept; then a run that made no
        # useful progress, left a step idle, or whose scan cycles are
        # overdue is reported as a failure, never as a green no-op.
        if: always() && steps.pipeline.outcome == 'success'
        run: node scripts/assert-progress.js
