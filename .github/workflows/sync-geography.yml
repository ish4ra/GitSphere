name: Sync geography

on:
  workflow_dispatch:
  schedule:
    # Monthly refresh of the population-aware gazetteer (GeoNames updates daily).
    - cron: '17 3 9 * *'

permissions:
  contents: write

concurrency:
  # Shares the data-writer lock with the ranking pipeline so only one job
  # ever commits generated data at a time.
  group: gitsphere-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build gazetteer from CSC + GeoNames
        run: node scripts/build-gazetteer.js

      - name: Syntax check
        run: npm run check:syntax

      - name: Commit geography update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A geography/
          if git diff --cached --quiet; then
            echo "No geography changes to commit."
            exit 0
          fi
          git commit -m "data: sync population-aware gazetteer"
          git pull --rebase
          git push
